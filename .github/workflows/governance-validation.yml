name: Governance Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".copilot/**"
      - ".gitignore"
      - ".vscode/**"
      - ".github/**"
      - "docs/**"
      - "scripts/validation/**"
      - "scripts/validation.tests/**"
      - "scripts/validation.cli.tests/**"
      - "LICENSE*"
      - "TRADEMARKS.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
  push:
    branches: [main]
    paths:
      - ".copilot/**"
      - ".gitignore"
      - ".vscode/**"
      - ".github/**"
      - "docs/**"
      - "scripts/validation/**"
      - "scripts/validation.tests/**"
      - "scripts/validation.cli.tests/**"
      - "LICENSE*"
      - "TRADEMARKS.md"
      - "CONTRIBUTING.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: scripts/validation/global.json
      - name: Validate governance files
        working-directory: scripts/validation
        run: dotnet run --configuration Release -- validate-governance ../..
      - name: Test trusted preview selection
        run: node --test .github/scripts/swa-preview.test.cjs
      - name: Test live preview verification and bounded retries
        run: node --test .github/scripts/verify-preview.test.cjs
      - name: Test release versioning and deployment boundary
        run: node --test .github/scripts/release.test.cjs
      - name: Test preview artifact boundary
        working-directory: scripts/validation
        run: dotnet run --project ../validation.tests/JamulaValidation.Tests.csproj --configuration Release
      - name: Test validation CLI happy and error paths
        working-directory: scripts/validation
        run: dotnet run --project ../validation.cli.tests/JamulaValidation.Cli.Tests.csproj --configuration Release
