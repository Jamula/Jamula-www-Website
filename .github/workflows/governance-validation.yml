name: Governance Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.copilot/**'
      - '.mcp.json'
      - '.gitignore'
      - '.vscode/**'
      - '.github/**'
      - '.squad/**'
      - 'docs/**'
      - 'scripts/validate_governance.py'
      - 'LICENSE*'
      - 'TRADEMARKS.md'
      - 'CONTRIBUTING.md'
      - 'THIRD_PARTY_NOTICES.md'
  push:
    branches: [main]
    paths:
      - '.copilot/**'
      - '.mcp.json'
      - '.gitignore'
      - '.vscode/**'
      - '.github/**'
      - '.squad/**'
      - 'docs/**'
      - 'scripts/validate_governance.py'
      - 'LICENSE*'
      - 'TRADEMARKS.md'
      - 'CONTRIBUTING.md'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate governance files
        run: python scripts/validate_governance.py
