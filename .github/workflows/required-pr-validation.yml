name: Required PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"
  NPM_VERSION: "12.2.1"
  NPM_INTEGRITY: "sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ=="

jobs:
  required-pr-validation:
    name: required-pr-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect website changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          website_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- ':(top)www/')"
          monitor_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- ':(top)scripts/monitor/' ':(top)global.json' ':(top)Directory.Build.props')"
          dotnet_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- ':(top)scripts/validation/' ':(top)scripts/validation.tests/' ':(top)scripts/validation.cli.tests/' ':(top)scripts/mbr/' ':(top)scripts/mcp/' ':(top)accelerator/' ':(top)www/src/content/tech/' ':(top)global.json' ':(top)Directory.Build.props' ':(top)Jamula.slnx')"
          if [[ -n "$website_files" ]]; then
            echo "website=true" >> "$GITHUB_OUTPUT"
            echo "Website validation required."
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
            echo "No website changes; Astro website build validation is not required."
          fi
          if [[ -n "$monitor_files" ]]; then
            echo "monitor=true" >> "$GITHUB_OUTPUT"
            echo "Monitor validation required."
          else
            echo "monitor=false" >> "$GITHUB_OUTPUT"
            echo "No monitor changes; monitor self-test is not required."
          fi
          if [[ -n "$dotnet_files" ]]; then
            echo "dotnet_tools=true" >> "$GITHUB_OUTPUT"
            echo "Additional .NET 11 tooling validation required."
          else
            echo "dotnet_tools=false" >> "$GITHUB_OUTPUT"
            echo "No additional .NET 11 tooling changes."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install verified npm
        shell: bash
        run: |
          set -euo pipefail
          observed_integrity="$(
            npm view "npm@${NPM_VERSION}" dist.integrity \
              --registry=https://registry.npmjs.org/
          )"
          if [[ "$observed_integrity" != "$NPM_INTEGRITY" ]]; then
            echo "::error::npm ${NPM_VERSION} registry integrity did not match the pinned value."
            exit 1
          fi
          npm install --global "npm@${NPM_VERSION}" \
            --ignore-scripts \
            --registry=https://registry.npmjs.org/
          [[ "$(npm --version)" == "$NPM_VERSION" ]]

      - name: Install website dependencies
        working-directory: .
        run: npm --prefix www ci

      - name: Test coverage gate
        working-directory: .
        run: node --test "scripts/coverage/*.test.*"

      - name: Check website formatting
        if: steps.changes.outputs.website == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" -- ':(top)www/' |
            while IFS= read -r -d '' file; do
              case "$file" in
                www/.prettierrc|*.astro|*.css|*.js|*.jsx|*.json|*.md|*.mdx|*.mjs|*.ts|*.tsx|*.yaml|*.yml)
                  printf './%s\0' "${file#www/}"
                  ;;
              esac
            done |
            xargs --null --no-run-if-empty npm exec -- prettier --check

      - name: Check Astro project
        if: steps.changes.outputs.website == 'true'
        run: npm run check

      - name: Build static website
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: "0.1.0"
        run: npm exec -- astro build

      - name: Test generated website contracts
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: "0.1.0"
        run: node scripts/test_built_site.mjs

      - name: Test website behavior regressions
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: "0.1.0"
        run: >-
          node --experimental-test-coverage --test
          --test-coverage-include=public/analytics-consent.js
          --test-coverage-lines=95 --test-coverage-branches=90
          tests/*.test.mjs

      - name: Build versionless preview website
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: ""
        run: npm exec -- astro build

      - name: Test versionless preview contracts
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: ""
          EXPECT_NO_RELEASE: "1"
        run: node scripts/test_built_site.mjs

      - name: Test versionless preview behavior regressions
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: ""
          EXPECT_NO_RELEASE: "1"
        run: >-
          node --experimental-test-coverage --test
          --test-coverage-include=public/analytics-consent.js
          --test-coverage-lines=95 --test-coverage-branches=90
          tests/*.test.mjs

      - name: Verify WCAG 2.2 AA, landmarks, and CLS in --network=none container
        if: steps.changes.outputs.website == 'true'
        working-directory: .
        run: >-
          docker run --rm --network=none --cap-drop=ALL
          --security-opt=no-new-privileges
          -v "$PWD:/work:ro" -w /work/www
          mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
          node scripts/verify-wcag-cls.mjs --dist /work/www/dist --require-network-none

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Verify .NET SDK and install dotnet-coverage
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          dotnet --version
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-coverage --version 18.12.0
          echo "DOTNET_COVERAGE_BIN=$RUNNER_TEMP/dotnet-tools/dotnet-coverage" >> "$GITHUB_ENV"

      - name: Build monitor
        if: steps.changes.outputs.monitor == 'true'
        working-directory: scripts/monitor
        run: dotnet build JamulaMonitor.csproj --configuration Release --nologo

      - name: Run monitor self-tests
        if: steps.changes.outputs.monitor == 'true'
        working-directory: scripts/monitor
        run: dotnet run --project JamulaMonitor.csproj --configuration Release --no-build -- --self-test

      - name: Collect Cobertura reports and enforce 95%/90% coverage gate
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          dotnet run --project scripts/validation/JamulaValidation.csproj --configuration Release -- validate-governance .
          node scripts/coverage/collect.mjs artifacts/coverage
          {
            echo "### First-party 95% line / 90% branch coverage gate"
            echo '```'
            node scripts/coverage/gate.mjs artifacts/coverage artifacts/coverage/summary.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
