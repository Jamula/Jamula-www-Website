name: Required PR Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.13.0"
  NPM_VERSION: "12.2.1"
  NPM_INTEGRITY: "sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ=="

jobs:
  required-pr-validation:
    name: required-pr-validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect website changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          website_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- ':(top)www/')"
          monitor_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- ':(top)scripts/monitor/')"
          if [[ -n "$website_files" ]]; then
            echo "website=true" >> "$GITHUB_OUTPUT"
            echo "Website validation required."
          else
            echo "website=false" >> "$GITHUB_OUTPUT"
            echo "No website changes; npm validation is not required."
          fi
          if [[ -n "$monitor_files" ]]; then
            echo "monitor=true" >> "$GITHUB_OUTPUT"
            echo "Monitor validation required."
          else
            echo "monitor=false" >> "$GITHUB_OUTPUT"
            echo "No monitor changes; .NET validation is not required."
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.website == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install verified npm
        if: steps.changes.outputs.website == 'true'
        shell: bash
        run: |
          set -euo pipefail
          observed_integrity="$(
            npm view "npm@${NPM_VERSION}" dist.integrity \
              --registry=https://registry.npmjs.org/
          )"
          if [[ "$observed_integrity" != "$NPM_INTEGRITY" ]]; then
            echo "::error::npm ${NPM_VERSION} registry integrity did not match the pinned value."
            exit 1
          fi
          npm install --global "npm@${NPM_VERSION}" \
            --ignore-scripts \
            --registry=https://registry.npmjs.org/
          [[ "$(npm --version)" == "$NPM_VERSION" ]]

      - name: Install website dependencies
        if: steps.changes.outputs.website == 'true'
        run: npm ci

      - name: Check website formatting
        if: steps.changes.outputs.website == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" -- ':(top)www/' |
            while IFS= read -r -d '' file; do
              case "$file" in
                www/.prettierrc|*.astro|*.css|*.js|*.jsx|*.json|*.md|*.mdx|*.mjs|*.ts|*.tsx|*.yaml|*.yml)
                  printf './%s\0' "${file#www/}"
                  ;;
              esac
            done |
            xargs --null --no-run-if-empty npm exec -- prettier --check

      - name: Check Astro project
        if: steps.changes.outputs.website == 'true'
        run: npm run check

      - name: Build static website
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: "0.1.0"
        run: npm exec -- astro build

      - name: Test generated website contracts
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: "0.1.0"
        run: node scripts/test_built_site.mjs

      - name: Test website behavior regressions
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: "0.1.0"
        run: node --test tests/*.test.mjs

      - name: Build versionless preview website
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: ""
        run: npm exec -- astro build

      - name: Test versionless preview contracts
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: ""
          EXPECT_NO_RELEASE: "1"
        run: node scripts/test_built_site.mjs

      - name: Test versionless preview behavior regressions
        if: steps.changes.outputs.website == 'true'
        env:
          PUBLIC_RELEASE_VERSION: ""
          EXPECT_NO_RELEASE: "1"
        run: node --test tests/*.test.mjs

      - name: Set up .NET SDK
        if: steps.changes.outputs.monitor == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: scripts/monitor/global.json

      - name: Verify .NET SDK
        if: steps.changes.outputs.monitor == 'true'
        working-directory: scripts/monitor
        run: dotnet --version

      - name: Build monitor
        if: steps.changes.outputs.monitor == 'true'
        working-directory: scripts/monitor
        run: dotnet build JamulaMonitor.csproj --configuration Release --nologo

      - name: Run monitor self-tests
        if: steps.changes.outputs.monitor == 'true'
        working-directory: scripts/monitor
        run: dotnet run --project JamulaMonitor.csproj --configuration Release --no-build -- --self-test
