name: Azure Static Web Apps

on:
  workflow_dispatch:
    inputs:
      change_type:
        description: "Material change creates a release; fix reuses the latest release"
        type: choice
        options: [material, fix]
        required: true
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  group: >-
    swa-${{
      github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || 'production'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26.13.0"
  NPM_VERSION: "12.2.1"
  NPM_INTEGRITY: "sha512-bKCmFRVT/BB+YPEYbZwQ1XUI3N5t4xKSpU1MxOjo7z3iWzKBJ0ZXRC1xFdEN+TC7N5TdywaBzf2dMXGJq/e2PQ=="
  DEPLOYMENT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare:
    name: Select deployment
    if: >-
      (
        github.event_name == 'workflow_dispatch'
      )
      || (
        github.event_name == 'pull_request'
        && github.event.action != 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
      version: ${{ steps.release.outputs.version }}
      selection: ${{ steps.release.outputs.selection }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Select current production or relevant preview
        id: gate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            if [[ "$GITHUB_REF" == "refs/heads/main" && "$latest_main" == "$GITHUB_SHA" ]]; then
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Non-main or stale release revision $GITHUB_SHA on $GITHUB_REF; main is $latest_main."
              exit 1
            fi
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            ':(top)www/' \
            ':(top).github/workflows/azure-static-web-apps.yml'; then
            echo "No deployable website changes remain in this pull request."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select release from published history
        if: github.event_name == 'workflow_dispatch'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_TYPE: ${{ inputs.change_type }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/tags?per_page=100" > release-tags.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > release-history.json
          selection="$(node .github/scripts/release.cjs select release-tags.json release-history.json "$CHANGE_TYPE" "$DEPLOYMENT_SHA")"
          version="$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$selection")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"
          echo "Selected v$version for $DEPLOYMENT_SHA."

  build:
    name: Build verified artifact
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www
    outputs:
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      release_attempt: ${{ steps.stamp.outputs.attempt }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install verified npm
        shell: bash
        run: |
          set -euo pipefail
          observed_integrity="$(
            npm view "npm@${NPM_VERSION}" dist.integrity \
              --registry=https://registry.npmjs.org/
          )"
          if [[ "$observed_integrity" != "$NPM_INTEGRITY" ]]; then
            echo "::error::npm ${NPM_VERSION} registry integrity did not match the pinned value."
            exit 1
          fi
          npm install --global "npm@${NPM_VERSION}" \
            --ignore-scripts \
            --registry=https://registry.npmjs.org/
          [[ "$(npm --version)" == "$NPM_VERSION" ]]

      - name: Install website dependencies
        run: npm ci

      - name: Check changed-file formatting
        run: >-
          npm exec -- prettier --check
          ../.github/workflows/azure-static-web-apps.yml
          public/staticwebapp.config.json

      - name: Check Astro project
        run: npm run check

      - name: Build static website
        env:
          PUBLIC_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.version || '' }}
        run: npm run build

      - name: Stamp release metadata
        if: github.event_name == 'workflow_dispatch'
        id: stamp
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node ../.github/scripts/release.cjs write dist/release.json "$RELEASE_VERSION" "$DEPLOYMENT_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/staticwebapp.config.json
          node -e "
            const fs = require('node:fs');
            const config = JSON.parse(fs.readFileSync('dist/staticwebapp.config.json', 'utf8'));
            if (config.responseOverrides?.['404']?.statusCode !== 404) process.exit(1);
            if (!config.globalHeaders?.['Content-Security-Policy']) process.exit(1);
            if (config.mimeTypes?.['.txt'] !== 'text/plain') process.exit(1);
          "

      - name: Upload immutable deployment artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swa-site-${{ env.DEPLOYMENT_SHA }}
          path: www/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy and verify
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.should_deploy == 'true'
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment: swa-deployment
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ATTEMPT: ${{ needs.build.outputs.release_attempt }}
      CHANGE_TYPE: ${{ inputs.change_type }}
      DEPLOYMENT_APP: net
      GH_TOKEN: ${{ github.token }}
    outputs:
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - name: Check out exact verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/verify-swa-csp.cjs
            .github/scripts/release.cjs
            .github/scripts/production-deployment.cjs
          sparse-checkout-cone-mode: false

      - name: Require production deployment token
        shell: bash
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.SWA_NET_DEPLOYMENT_TOKEN }}
        run: |
          if [[ -z "$DEPLOYMENT_TOKEN" ]]; then
            echo "::error::Environment secret swa-deployment/SWA_NET_DEPLOYMENT_TOKEN is unavailable."
            exit 1
          fi

      - name: Download verified deployment artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swa-site-${{ env.DEPLOYMENT_SHA }}
          path: www/dist

      - name: Verify downloaded configuration
        shell: bash
        run: test -f www/dist/staticwebapp.config.json

      - name: Require current main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$latest_main" == "$DEPLOYMENT_SHA" ]] || { echo "::error::main advanced; release aborted."; exit 1; }

      - name: Record production deployment
        id: record
        run: node .github/scripts/production-deployment.cjs start

      - name: Deploy prebuilt site
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_NET_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: www/dist
          output_location: ""
          skip_app_build: true

      - name: Verify live site
        id: verify
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ATTEMPT: ${{ needs.build.outputs.release_attempt }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYED_URL%/}" != "https://ashy-beach-033c7d01e.7.azurestaticapps.net" ]]; then
            echo "::error::The deployment action returned an unexpected URL."
            exit 1
          fi

          headers="$(mktemp)"
          robots_headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$robots_headers" "$body"' EXIT

          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --dump-header "$headers" --output "$body" \
              "${DEPLOYED_URL%/}/"; then
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "::error::The deployed home page did not become ready."
              exit 1
            fi
            sleep 10
          done

          metadata_file="release-metadata.json"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Cache-Control: no-cache' --output "$metadata_file" \
              "${DEPLOYED_URL%/}/release.json?run=${GITHUB_RUN_ID}-${RELEASE_ATTEMPT}" &&
              node .github/scripts/release.cjs verify "$metadata_file" "$RELEASE_VERSION" "$DEPLOYMENT_SHA" "$GITHUB_RUN_ID" "$RELEASE_ATTEMPT"; then
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "::error::Live release metadata did not match the deployed artifact."
              exit 1
            fi
            sleep 10
          done
          rm -f "$metadata_file"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --header 'Cache-Control: no-cache' \
            --dump-header "$headers" --output "$body" \
            "${DEPLOYED_URL%/}/"

          header_value() {
            awk -F': ' -v wanted="$1" '
              tolower($1) == tolower(wanted) {
                sub(/\r$/, "", $2)
                value = $2
              }
              END { print value }
            ' "$headers"
          }
          expect_header() {
            local name="$1"
            local expected="$2"
            local observed
            observed="$(header_value "$name")"
            if [[ "$observed" != "$expected" ]]; then
              echo "::error::Unexpected ${name} header."
              exit 1
            fi
          }

          grep -qi '<title>.*Jamula' "$body"
          node .github/scripts/verify-swa-csp.cjs \
            www/dist/staticwebapp.config.json "$headers"
          expect_header "X-Frame-Options" "DENY"
          expect_header "X-Content-Type-Options" "nosniff"
          expect_header "Referrer-Policy" "strict-origin-when-cross-origin"
          expect_header "Permissions-Policy" "camera=(), microphone=(), geolocation=()"

          hsts="$(header_value "Strict-Transport-Security")"
          [[ -n "$hsts" ]] || {
            echo "::error::Strict-Transport-Security was not enforced."
            exit 1
          }

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --dump-header "$robots_headers" --output /dev/null \
            "${DEPLOYED_URL%/}/robots.txt"
          grep -Eiq '^content-type: *text/plain([;[:space:]]|$)' "$robots_headers"

          missing_status="$(
            curl --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --output "$body" --write-out '%{http_code}' \
              "${DEPLOYED_URL%/}/__jamula_missing_route__"
          )"
          [[ "$missing_status" == "404" ]]
          grep -qi 'Page not found' "$body"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            x_robots_tag="$(header_value "X-Robots-Tag")"
            if [[ "${x_robots_tag,,}" != *"none"* ]]; then
              echo "::error::Azure did not enforce X-Robots-Tag: none on the preview."
              exit 1
            fi
          fi

          {
            echo "### Verified Azure deployment"
            echo "- Release: \`v${RELEASE_VERSION}\`"
            echo "- Revision: \`${DEPLOYMENT_SHA}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo "- URL: ${DEPLOYED_URL}"
            echo "- Configuration: CSP, framing, MIME, referrer, permissions, 404 response"
            echo "- Azure platform: TLS/HSTS$( [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && printf ', X-Robots-Tag: none' )"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployment result
        if: always() && steps.record.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          state=failure
          if [[ "$VERIFY_OUTCOME" == "success" ]]; then state=success; fi
          node .github/scripts/production-deployment.cjs status "$DEPLOYMENT_ID" "$state" "$DEPLOYED_URL"

  deploy-com:
    name: Deploy and verify .com app
    needs: [prepare, build]
    if: >-
      needs.prepare.outputs.should_deploy == 'true'
      && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment: swa-deployment
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ATTEMPT: ${{ needs.build.outputs.release_attempt }}
      CHANGE_TYPE: ${{ inputs.change_type }}
      DEPLOYMENT_APP: com
      GH_TOKEN: ${{ github.token }}
    outputs:
      url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - name: Check out exact verifier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/verify-swa-csp.cjs
            .github/scripts/release.cjs
            .github/scripts/production-deployment.cjs
          sparse-checkout-cone-mode: false

      - name: Require companion deployment token
        shell: bash
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.SWA_COM_DEPLOYMENT_TOKEN }}
        run: |
          if [[ -z "$DEPLOYMENT_TOKEN" ]]; then
            echo "::error::Environment secret swa-deployment/SWA_COM_DEPLOYMENT_TOKEN is unavailable."
            exit 1
          fi

      - name: Download verified deployment artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swa-site-${{ env.DEPLOYMENT_SHA }}
          path: www/dist

      - name: Verify downloaded configuration
        shell: bash
        run: test -f www/dist/staticwebapp.config.json

      - name: Require current main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$latest_main" == "$DEPLOYMENT_SHA" ]] || { echo "::error::main advanced; release aborted."; exit 1; }

      - name: Record production deployment
        id: record
        run: node .github/scripts/production-deployment.cjs start

      - name: Deploy prebuilt site
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_COM_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: www/dist
          output_location: ""
          skip_app_build: true

      - name: Verify live site
        id: verify
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ATTEMPT: ${{ needs.build.outputs.release_attempt }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOYED_URL%/}" != "https://red-cliff-0ee064a1e.2.azurestaticapps.net" ]]; then
            echo "::error::The deployment action returned an unexpected URL."
            exit 1
          fi

          headers="$(mktemp)"
          robots_headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$robots_headers" "$body"' EXIT

          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --dump-header "$headers" --output "$body" \
              "${DEPLOYED_URL%/}/"; then
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "::error::The deployed home page did not become ready."
              exit 1
            fi
            sleep 10
          done

          metadata_file="release-metadata.json"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --header 'Cache-Control: no-cache' --output "$metadata_file" \
              "${DEPLOYED_URL%/}/release.json?run=${GITHUB_RUN_ID}-${RELEASE_ATTEMPT}" &&
              node .github/scripts/release.cjs verify "$metadata_file" "$RELEASE_VERSION" "$DEPLOYMENT_SHA" "$GITHUB_RUN_ID" "$RELEASE_ATTEMPT"; then
              break
            fi
            if [[ "$attempt" == 18 ]]; then
              echo "::error::Live release metadata did not match the deployed artifact."
              exit 1
            fi
            sleep 10
          done
          rm -f "$metadata_file"

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 --header 'Cache-Control: no-cache' \
            --dump-header "$headers" --output "$body" \
            "${DEPLOYED_URL%/}/"

          header_value() {
            awk -F': ' -v wanted="$1" '
              tolower($1) == tolower(wanted) {
                sub(/\r$/, "", $2)
                value = $2
              }
              END { print value }
            ' "$headers"
          }
          expect_header() {
            local name="$1"
            local expected="$2"
            local observed
            observed="$(header_value "$name")"
            if [[ "$observed" != "$expected" ]]; then
              echo "::error::Unexpected ${name} header."
              exit 1
            fi
          }

          grep -qi '<title>.*Jamula' "$body"
          node .github/scripts/verify-swa-csp.cjs \
            www/dist/staticwebapp.config.json "$headers"
          expect_header "X-Frame-Options" "DENY"
          expect_header "X-Content-Type-Options" "nosniff"
          expect_header "Referrer-Policy" "strict-origin-when-cross-origin"
          expect_header "Permissions-Policy" "camera=(), microphone=(), geolocation=()"

          hsts="$(header_value "Strict-Transport-Security")"
          [[ -n "$hsts" ]] || {
            echo "::error::Strict-Transport-Security was not enforced."
            exit 1
          }

          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            --dump-header "$robots_headers" --output /dev/null \
            "${DEPLOYED_URL%/}/robots.txt"
          grep -Eiq '^content-type: *text/plain([;[:space:]]|$)' "$robots_headers"

          missing_status="$(
            curl --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --output "$body" --write-out '%{http_code}' \
              "${DEPLOYED_URL%/}/__jamula_missing_route__"
          )"
          [[ "$missing_status" == "404" ]]
          grep -qi 'Page not found' "$body"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            x_robots_tag="$(header_value "X-Robots-Tag")"
            if [[ "${x_robots_tag,,}" != *"none"* ]]; then
              echo "::error::Azure did not enforce X-Robots-Tag: none on the preview."
              exit 1
            fi
          fi

          {
            echo "### Verified Azure deployment"
            echo "- Release: \`v${RELEASE_VERSION}\`"
            echo "- Revision: \`${DEPLOYMENT_SHA}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo "- URL: ${DEPLOYED_URL}"
            echo "- Configuration: CSP, framing, MIME, referrer, permissions, 404 response"
            echo "- Azure platform: TLS/HSTS$( [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] && printf ', X-Robots-Tag: none' )"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record deployment result
        if: always() && steps.record.outputs.id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        run: |
          state=failure
          if [[ "$VERIFY_OUTCOME" == "success" ]]; then state=success; fi
          node .github/scripts/production-deployment.cjs status "$DEPLOYMENT_ID" "$state" "$DEPLOYED_URL"

  publish:
    name: Publish verified release
    needs: [prepare, build, deploy, deploy-com]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tools at exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOYMENT_SHA }}
          persist-credentials: false
      - name: Recheck main and release history, then publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_TYPE: ${{ inputs.change_type }}
          RELEASE_SELECTION: ${{ needs.prepare.outputs.selection }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ATTEMPT: ${{ needs.build.outputs.release_attempt }}
          NET_URL: ${{ needs.deploy.outputs.url }}
          COM_URL: ${{ needs.deploy-com.outputs.url }}
        run: |
          set -euo pipefail
          for url in "$NET_URL" "$COM_URL"; do
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --header 'Cache-Control: no-cache' \
              --output release-metadata.json "${url%/}/release.json?run=${GITHUB_RUN_ID}-${RELEASE_ATTEMPT}"
            node .github/scripts/release.cjs verify release-metadata.json "$RELEASE_VERSION" "$DEPLOYMENT_SHA" "$GITHUB_RUN_ID" "$RELEASE_ATTEMPT"
          done
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$latest_main" == "$DEPLOYMENT_SHA" ]] || { echo "::error::main advanced; release not published."; exit 1; }
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/tags?per_page=100" > release-tags.json
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > release-history.json
          selection="$(node .github/scripts/release.cjs select release-tags.json release-history.json "$CHANGE_TYPE" "$DEPLOYMENT_SHA")"
          [[ "$selection" == "$RELEASE_SELECTION" ]] || { echo "::error::Release history changed; publication aborted."; exit 1; }
          if [[ "$CHANGE_TYPE" == "material" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/v$RELEASE_VERSION" -f "sha=$DEPLOYMENT_SHA"
            latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
            [[ "$latest_main" == "$DEPLOYMENT_SHA" ]] || { echo "::error::main advanced after tag creation; release not published."; exit 1; }
            gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$RELEASE_VERSION" --notes "Verified Azure deployment of revision $DEPLOYMENT_SHA."
          fi
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$latest_main" == "$DEPLOYMENT_SHA" ]] || { echo "::error::main advanced during publication; inspect the published release."; exit 1; }
          echo "Verified $CHANGE_TYPE deployment $DEPLOYMENT_SHA associated with v$RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
