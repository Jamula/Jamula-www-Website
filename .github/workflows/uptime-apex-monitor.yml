name: Uptime and Apex A-Record Monitor

# Workflow enablement is a repository setting independent of this YAML file.
# If disabled, enable it only after the approved apex cutover, run it manually,
# and confirm the result before closing the associated operational issue.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime-apex-monitor
  cancel-in-progress: false

jobs:
  check:
    name: Apex DNS and approved hostname health
    runs-on: ubuntu-latest
    # .NET 11 STS; install the SDK from root global.json.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Verify .NET SDK
        working-directory: scripts/monitor
        run: dotnet --version

      - name: Build monitor
        working-directory: scripts/monitor
        run: dotnet build JamulaMonitor.csproj -c Release --nologo

      - name: Run monitor self-tests
        working-directory: scripts/monitor
        run: >-
          dotnet run --project JamulaMonitor.csproj
          -c Release --no-build -- --self-test

      - name: Check apex A record and all approved hostnames
        working-directory: scripts/monitor
        run: >-
          dotnet run --project JamulaMonitor.csproj
          -c Release --no-build

      - name: Report success
        if: success()
        run: |
          {
            echo "### ✅ Hostname monitor passed"
            echo "- \`jamula.net\` A record → approved Azure SWA IP verified"
            echo "- \`jamula.net\`, \`www.jamula.net\`, \`jamula.com\`, and \`www.jamula.com\` passed HTTPS, canonical URL, same-host HTTP upgrade, expected content, and 404 checks"
          } >> "$GITHUB_STEP_SUMMARY"

  alert:
    name: Escalate scheduled monitor failure
    needs: check
    if: failure() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted alert logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or retain an actionable outage issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const { escalate } = await import(
              pathToFileURL(path.resolve(".github/scripts/uptime-alert.mjs")).href,
            );
            const url = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const result = await escalate(github, context.repo, url);
            await core.summary.addRaw(`Monitor alert: ${result.html_url}`).write();
