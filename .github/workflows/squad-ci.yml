name: Squad CI

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install npm 12
        run: npm install --global npm@12.0.2

      - name: Install website dependencies
        working-directory: www
        run: npm ci

      - name: Check website
        working-directory: www
        run: npm run check

      - name: Build website
        working-directory: www
        run: npm run build

      - name: Build monitor
        working-directory: scripts/monitor
        run: dotnet build JamulaMonitor.csproj --configuration Release --nologo

      - name: Run monitor self-tests
        working-directory: scripts/monitor
        run: dotnet run --project JamulaMonitor.csproj --configuration Release --no-build -- --self-test
