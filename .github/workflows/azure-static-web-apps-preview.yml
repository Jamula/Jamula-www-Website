name: Azure Static Web Apps Preview

on:
  workflow_run:
    workflows: ["Azure Static Web Apps"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: swa-preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: swa-deployment
    steps:
      - name: Check out trusted deployment tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted

      - name: Set up trusted .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: trusted/global.json

      - name: Select current preview and download immutable artifact
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const { runPreviewGate } = await import(
              pathToFileURL(path.resolve("trusted/.github/scripts/swa-preview.mjs")).href,
            );
            await runPreviewGate({ github, context, core });

      - name: Extract only static files and verify trusted configuration
        if: steps.gate.outputs.action == 'upload'
        working-directory: trusted/scripts/validation
        run: dotnet run --configuration Release -- validate-artifact "$GITHUB_WORKSPACE/.preview/site.zip" "$GITHUB_WORKSPACE/www/dist" "$GITHUB_WORKSPACE/trusted/www/public/staticwebapp.config.json"

      - name: Recheck current PR before deployment
        if: steps.gate.outputs.action != 'skip'
        id: current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const { runPreviewRecheck } = await import(
              pathToFileURL(path.resolve("trusted/.github/scripts/swa-preview.mjs")).href,
            );
            await runPreviewRecheck({
              github,
              context,
              core,
              action: "${{ steps.gate.outputs.action }}",
            });

      - name: Require trusted deployment token
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.SWA_NET_DEPLOYMENT_TOKEN }}
          PREVIEW_ACTION: ${{ steps.gate.outputs.action }}
        run: |
          if [[ -z "$DEPLOYMENT_TOKEN" ]]; then
            echo "::error::Environment secret swa-deployment/SWA_NET_DEPLOYMENT_TOKEN is unavailable to the trusted preview workflow."
            exit 1
          fi
          if [[ "$PREVIEW_ACTION" == "close" ]]; then
            cp .preview/event.json "$GITHUB_EVENT_PATH"
          fi

      - name: Deploy or close selected PR preview
        if: steps.current.outputs.deploy == 'true'
        id: deploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch: supports explicit environments
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_NET_DEPLOYMENT_TOKEN }}
          action: ${{ steps.gate.outputs.action }}
          app_location: www/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
          deployment_environment: ${{ steps.current.outputs.environment }}

      - name: Verify isolated live preview
        if: steps.current.outputs.deploy == 'true' && steps.gate.outputs.action == 'upload'
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.static_web_app_url }}
          PR_NUMBER: ${{ steps.gate.outputs.number }}
          DEPLOYMENT_SHA: ${{ steps.gate.outputs.sha }}
          ARTIFACT_DIGEST: ${{ steps.gate.outputs.digest }}
        run: |
          set -euo pipefail
          expected="https://ashy-beach-033c7d01e-${PR_NUMBER}.7.azurestaticapps.net"
          if [[ "${DEPLOYED_URL%/}" != "$expected" ]]; then
            echo "::error::The deployment URL is not the selected PR preview."
            exit 1
          fi
          node trusted/.github/scripts/verify-preview.mjs "$DEPLOYED_URL"
          {
            echo "### Verified isolated PR preview"
            echo "- PR: ${PR_NUMBER}"
            echo "- Revision: \`${DEPLOYMENT_SHA}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo "- URL: ${DEPLOYED_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
